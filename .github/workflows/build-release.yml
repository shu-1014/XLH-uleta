name: Build StarFox (XLH)

# Manual trigger only, avoids clashing with the upstream release.yml on v* tags.
# Optionally fill ko_repo to also pull your own prebuilt .ko files.

on:
  workflow_dispatch:
    inputs:
      ko_repo:
        description: 'Your .ko repo (owner/repo), leave empty to skip'
        required: false
        default: ''
      ko_tag:
        description: '.ko release tag'
        required: false
        default: 'lkm-latest'

permissions:
  contents: write
  actions: read

env:
  KO_REPO: ${{ github.event.inputs.ko_repo }}
  KO_TAG: ${{ github.event.inputs.ko_tag || 'lkm-latest' }}

jobs:
  build-manager:
    name: Build manager APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ubuntu-latest already ships an Android SDK, so do NOT use
      # android-actions/setup-android here: it calls `sdkmanager "tools"`,
      # and that package no longer exists in current SDK repositories,
      # which makes the whole step fail with exit code 1.
      - name: Install SDK packages
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "SDK at $ANDROID_HOME"
          ls "$ANDROID_HOME"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -n 1)
          fi
          echo "sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" --version || true

          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" > /dev/null 2>&1 || true

          PLATFORM=""
          for api in 37 36; do
            if "$SDKMANAGER" "platforms;android-$api" > /dev/null 2>&1; then
              PLATFORM="$api"; break
            fi
          done
          [ -n "$PLATFORM" ] || { echo "no platform installed"; exit 1; }
          echo "PLATFORM_API=$PLATFORM" >> $GITHUB_ENV
          echo "platform android-$PLATFORM"

          BT=""
          for bt in 37.0.0 36.0.0; do
            if "$SDKMANAGER" "build-tools;$bt" > /dev/null 2>&1; then
              BT="$bt"; break
            fi
          done
          [ -n "$BT" ] || { echo "no build-tools"; exit 1; }
          echo "BUILD_TOOLS=$BT" >> $GITHUB_ENV
          echo "build-tools $BT"

          # NDK versions must exist on Maven Central as org.lsposed.libcxx:libcxx,
          # because libs.versions.toml binds lsposed-cxx to version.ref = "ndk".
          NDK=""
          for ndk in 29.0.14206865 28.1.13356709 27.0.12077973; do
            if "$SDKMANAGER" "ndk;$ndk" > /dev/null 2>&1; then
              NDK="$ndk"; break
            fi
          done
          [ -n "$NDK" ] || { echo "no ndk"; exit 1; }
          echo "NDK_VER=$NDK" >> $GITHUB_ENV
          echo "ndk $NDK"

      - name: Align gradle to installed SDK
        run: |
          python3 - <<'PY'
          import os, re, pathlib
          api = os.environ['PLATFORM_API']
          bt  = os.environ['BUILD_TOOLS']
          ndk = os.environ['NDK_VER']

          toml = pathlib.Path('manager/gradle/libs.versions.toml')
          t = toml.read_text(encoding='utf-8')
          t = re.sub(r'(?m)^ndk\s*=\s*"[^"]+"', f'ndk = "{ndk}"', t)
          toml.write_text(t, encoding='utf-8')

          g = pathlib.Path('manager/build.gradle.kts')
          s = g.read_text(encoding='utf-8')
          s = re.sub(r'extra\["androidCompileSdkVersion"\]\s*=\s*\d+', f'extra["androidCompileSdkVersion"] = {api}', s)
          s = re.sub(r'extra\["androidTargetSdkVersion"\]\s*=\s*\d+', f'extra["androidTargetSdkVersion"] = {api}', s)
          s = re.sub(r'extra\["androidBuildToolsVersion"\]\s*=\s*"[^"]+"', f'extra["androidBuildToolsVersion"] = "{bt}"', s)
          g.write_text(s, encoding='utf-8')
          print('aligned', api, bt, ndk)
          PY

      - name: Signing config
        run: |
          mkdir -p manager
          KEYSTORE="$RUNNER_TEMP/starfox.jks"
          keytool -genkeypair -keystore "$KEYSTORE" -alias starfox \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass starfox123 -keypass starfox123 \
            -dname "CN=StarFox,O=StarFox,C=CN" -noprompt
          keytool -list -keystore "$KEYSTORE" -storepass starfox123
          # properties format: backslashes are escapes, so keep forward slashes
          {
            echo "KEYSTORE_FILE=$KEYSTORE"
            echo "KEYSTORE_PASSWORD=starfox123"
            echo "KEY_ALIAS=starfox"
            echo "KEY_PASSWORD=starfox123"
          } > manager/sign.properties
          cat manager/sign.properties

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('manager/**/*.gradle*', 'manager/gradle/**') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build release APK
        working-directory: manager
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease -PKSU_PACKAGE_NAME=com.iki.xlh --no-daemon --stacktrace

      - name: Collect APK
        if: always()
        run: |
          mkdir -p out
          find manager/app/build/outputs -name '*.apk' -exec cp {} out/ \; 2>/dev/null || true
          ls -la out || true

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: starfox-manager-apk
          path: out/*.apk
          if-no-files-found: warn
