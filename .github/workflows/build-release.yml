        run: |
          mkdir -p manager
          KEYSTORE="$RUNNER_TEMP/starfox.jks"

          if [ -n "${{ secrets.SIGNING_KEY_BASE64 }}" ]; then
            printf '%s' "${{ secrets.SIGNING_KEY_BASE64 }}" | tr -d ' \t\r\n' | base64 -d > "$KEYSTORE"
            echo "keystore: from SIGNING_KEY_BASE64 secret"
          elif [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | tr -d ' \t\r\n' | base64 -d > "$KEYSTORE"
            echo "keystore: builtin (fixed signature)"
          else
            keytool -genkeypair -keystore "$KEYSTORE" -alias starfox \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass starfox123 -keypass starfox123 \
              -dname "CN=StarFox,O=StarFox,C=CN" -noprompt
            echo "::warning::ephemeral keystore, signature will change"
          fi

          ls -l "$KEYSTORE"

          # sign.properties 是 Java properties 格式，反斜杠是转义符，
          # 所以路径必须用正斜杠，否则密钥路径失效、静默产出 unsigned 包
          {
            echo "KEYSTORE_FILE=$KEYSTORE"
            echo "KEYSTORE_PASSWORD=starfox123"
            echo "KEY_ALIAS=starfox"
            echo "KEY_PASSWORD=starfox123"
          } > manager/sign.properties
          cat manager/sign.properties

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('manager/**/*.gradle*', 'manager/gradle/**') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build release APK
        working-directory: manager
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease -PKSU_PACKAGE_NAME=com.iki.xlh --no-daemon --stacktrace

      - name: Collect APK
        if: always()
        run: |
          mkdir -p out
          find manager/app/build/outputs -name '*.apk' -exec cp {} out/ \; 2>/dev/null || true
          ls -la out || true

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: starfox-manager-apk
          path: out/*.apk
          if-no-files-found: warn
