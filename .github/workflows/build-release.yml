name: Build StarFox (XLH)

# 手动触发，避免和上游 release.yml 的 v* tag 冲突
on:
  workflow_dispatch:
    inputs:
      ko_repo:
        description: '你自己的 .ko 仓库 (owner/repo)，留空则跳过'
        required: false
        default: ''
      ko_tag:
        description: '.ko 所在的 Release tag'
        required: false
        default: 'lkm-latest'

permissions:
  contents: write
  actions: read

env:
  KO_REPO: ${{ github.event.inputs.ko_repo }}
  KO_TAG: ${{ github.event.inputs.ko_tag || 'lkm-latest' }}

jobs:
  build-manager:
    name: Build manager APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # ubuntu-latest 自带 Android SDK，不要用 android-actions/setup-android：
      # 它内部执行 `sdkmanager "tools"`，而该包已被 Google 移除，会直接 exit 1。
      - name: Install SDK packages
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "SDK at $ANDROID_HOME"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -n 1)
          fi
          echo "sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" > /dev/null 2>&1 || true

          # 依赖要求 compileSdk >= 37，且 platforms 包名带小版本号 (37.0/37.1/37.2)
          PLATFORM=""
          MINOR=""
          for pkg in 37.0 37.2 37.1 36; do
            if "$SDKMANAGER" "platforms;android-$pkg" > /dev/null 2>&1; then
              PLATFORM="$pkg"
              case "$pkg" in
                *.*) MINOR="${pkg#*.}" ;;
                *)   MINOR="0" ;;
              esac
              break
            fi
          done
          [ -n "$PLATFORM" ] || { echo "no platform installed"; exit 1; }
          echo "PLATFORM_API=$PLATFORM" >> $GITHUB_ENV
          echo "PLATFORM_MINOR=$MINOR" >> $GITHUB_ENV
          echo "platform android-$PLATFORM (minor=$MINOR)"

          BT=""
          for bt in 37.0.0 36.0.0; do
            if "$SDKMANAGER" "build-tools;$bt" > /dev/null 2>&1; then
              BT="$bt"; break
            fi
          done
          if [ -z "$BT" ]; then
            BT=$("$SDKMANAGER" --list 2>/dev/null | grep -o 'build-tools;3[0-9]\+\.[0-9]\+\.[0-9]\+' | sort -u | tail -n 1 | cut -d';' -f2)
          fi
          [ -n "$BT" ] || { echo "no build-tools"; exit 1; }
          echo "BUILD_TOOLS=$BT" >> $GITHUB_ENV
          echo "build-tools $BT"

          # NDK 版本必须同时存在于 Maven Central 的 org.lsposed.libcxx:libcxx，
          # 因为 libs.versions.toml 里 lsposed-cxx 用的是 version.ref = "ndk"
          NDK=""
          for ndk in 29.0.14206865 28.1.13356709 27.0.12077973; do
            if "$SDKMANAGER" "ndk;$ndk" > /dev/null 2>&1; then
              NDK="$ndk"; break
            fi
          done
          [ -n "$NDK" ] || { echo "no ndk"; exit 1; }
          echo "NDK_VER=$NDK" >> $GITHUB_ENV
          echo "ndk $NDK"

      - name: Align gradle to installed SDK
        run: |
          python3 - <<'PY'
          import os, re, pathlib
          platform = os.environ['PLATFORM_API']      # e.g. 37.0 or 36
          minor    = os.environ['PLATFORM_MINOR']    # e.g. 0
          bt       = os.environ['BUILD_TOOLS']
          ndk      = os.environ['NDK_VER']
          api      = platform.split('.')[0]

          toml = pathlib.Path('manager/gradle/libs.versions.toml')
          t = toml.read_text(encoding='utf-8')
          t = re.sub(r'(?m)^ndk\s*=\s*"[^"]+"', f'ndk = "{ndk}"', t)
          toml.write_text(t, encoding='utf-8')

          g = pathlib.Path('manager/build.gradle.kts')
          s = g.read_text(encoding='utf-8')
          s = re.sub(r'extra\["androidCompileSdkVersion"\]\s*=\s*\d+',
                     f'extra["androidCompileSdkVersion"] = {api}', s)
          s = re.sub(r'extra\["androidCompileSdkVersionMinor"\]\s*=\s*\d+',
                     f'extra["androidCompileSdkVersionMinor"] = {minor}', s)
          s = re.sub(r'extra\["androidTargetSdkVersion"\]\s*=\s*\d+',
                     f'extra["androidTargetSdkVersion"] = {api}', s)
          s = re.sub(r'extra\["androidBuildToolsVersion"\]\s*=\s*"[^"]+"',
                     f'extra["androidBuildToolsVersion"] = "{bt}"', s)
          g.write_text(s, encoding='utf-8')
          print(f'aligned compileSdk={api} minor={minor} buildTools={bt} ndk={ndk}')
          PY

        - name: Signing config
          run: |
            mkdir -p manager
            KEYSTORE="$RUNNER_TEMP/starfox.jks"

            # 固定签名：内核按「证书 size + SHA256」认管理器，
            # 每次构建换密钥会导致升级后认不到管理器，所以优先用固定 keystore。
            if [ -n "${{ secrets.SIGNING_KEY_BASE64 }}" ]; then
              echo "${{ secrets.SIGNING_KEY_BASE64 }}" | base64 -d > "$KEYSTORE"
              echo "keystore: from SIGNING_KEY_BASE64 secret"
            else
              keytool -genkeypair -keystore "$KEYSTORE" -alias starfox \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass starfox123 -keypass starfox123 \
                -dname "CN=StarFox,O=StarFox,C=CN" -noprompt
              echo "::warning::no fixed keystore, signature changes every build"
              echo "=====KEYSTORE_B64_START====="
              base64 -w0 "$KEYSTORE"
              echo ""
              echo "=====KEYSTORE_B64_END====="
            fi

            # sign.properties 是 Java properties 格式，反斜杠是转义符，
            # 所以路径必须用正斜杠，否则密钥路径失效、静默产出 unsigned 包
            {
              echo "KEYSTORE_FILE=$KEYSTORE"
              echo "KEYSTORE_PASSWORD=starfox123"
              echo "KEY_ALIAS=starfox"
              echo "KEY_PASSWORD=starfox123"
            } > manager/sign.properties
            cat manager/sign.properties

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('manager/**/*.gradle*', 'manager/gradle/**') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build release APK
        working-directory: manager
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease -PKSU_PACKAGE_NAME=com.iki.xlh --no-daemon --stacktrace

      - name: Collect APK
        if: always()
        run: |
          mkdir -p out
          find manager/app/build/outputs -name '*.apk' -exec cp {} out/ \; 2>/dev/null || true
          ls -la out || true

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: starfox-manager-apk
          path: out/*.apk
          if-no-files-found: warn
